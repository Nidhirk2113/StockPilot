services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockpilot
      POSTGRES_USER: stockpilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockpilot_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - stockpilot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockpilot -d stockpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://stockpilot:${POSTGRES_PASSWORD:-stockpilot_dev_only}@db:5432/stockpilot?schema=public
      PORT: 5000
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  stockpilot_pg:
